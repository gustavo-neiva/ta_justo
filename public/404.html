<!doctype html>
<html lang="pt-BR">
  <head>
    <title>Página não encontrada — Tá Justo?</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      :root {
        --color-primary: #035925;
        --color-primary-light: #2e7d32;
        --color-accent: #f5e197;
        --color-text: #1a1a1a;
        --color-text-secondary: #585858;
        --color-bg: #fafafa;
        --color-border: #e0e0e0;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        background: var(--color-bg);
        color: var(--color-text);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 24px;
        text-align: center;
      }
      main { max-width: 480px; }
      .art { width: 96px; height: 96px; margin: 0 auto; }
      .art svg { display: block; }
      .code {
        display: inline-block;
        background: var(--color-primary);
        color: var(--color-accent);
        font-weight: 800;
        font-size: 0.875rem;
        letter-spacing: 0.1em;
        padding: 4px 12px;
        border-radius: 9999px;
        margin: 16px 0 8px;
      }
      h1 { font-size: 1.875rem; font-weight: 700; margin-bottom: 12px; }
      p { color: var(--color-text-secondary); line-height: 1.65; margin-bottom: 32px; }
      a.btn {
        display: inline-block;
        background: var(--color-primary);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
      }
      a.btn:hover { background: var(--color-primary-light); }
    </style>
  </head>
  <body>
    <!-- This file lives in public/404.html -->
    <main>
      <div class="art">
        <svg viewBox="0 0 96 96" fill="none" stroke="#035925" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Fatia de melancia">
          <path d="M16 28 H80 A32 32 0 0 1 16 28 Z"/>
          <path d="M24 28 A24 24 0 0 0 72 28"/>
          <circle cx="40" cy="42" r="2.5" fill="#035925" stroke="none"/>
          <circle cx="56" cy="42" r="2.5" fill="#035925" stroke="none"/>
          <circle cx="48" cy="54" r="2.5" fill="#035925" stroke="none"/>
        </svg>
      </div>
      <div class="code">404</div>
      <h1>Essa página saiu da banca</h1>
      <p>Procuramos em tudo: na fruteira, na caixa de ovos, até no fundo do caminhão da CEASA. Nada. Talvez o endereço esteja errado, ou a página tenha ido pra feira e não voltou.</p>
      <a class="btn" href="/">Voltar pra feira</a>
    </main>
  </body>
</html>
