<!doctype html>
<html lang="pt-BR">
  <head>
    <title>Pedido não aceito — Tá Justo?</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      :root {
        --color-primary: #035925;
        --color-primary-light: #2e7d32;
        --color-accent: #f5e197;
        --color-text: #1a1a1a;
        --color-text-secondary: #585858;
        --color-bg: #fafafa;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        background: var(--color-bg);
        color: var(--color-text);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 24px;
        text-align: center;
      }
      main { max-width: 480px; }
      .art { width: 96px; height: 96px; margin: 0 auto; }
      .art svg { display: block; }
      .code {
        display: inline-block;
        background: var(--color-primary);
        color: var(--color-accent);
        font-weight: 800;
        font-size: 0.875rem;
        letter-spacing: 0.1em;
        padding: 4px 12px;
        border-radius: 9999px;
        margin: 16px 0 8px;
      }
      h1 { font-size: 1.875rem; font-weight: 700; margin-bottom: 12px; }
      p { color: var(--color-text-secondary); line-height: 1.65; margin-bottom: 32px; }
      a.btn {
        display: inline-block;
        background: var(--color-primary);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
      }
      a.btn:hover { background: var(--color-primary-light); }
    </style>
  </head>
  <body>
    <!-- This file lives in public/422.html -->
    <main>
      <div class="art">
        <svg viewBox="0 0 96 96" fill="none" stroke="#035925" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Balança">
          <circle cx="48" cy="16" r="4"/>
          <path d="M48 20 V72"/>
          <path d="M34 78 H62"/>
          <path d="M20 28 H76"/>
          <path d="M20 28 L10 44 M20 28 L30 44"/>
          <path d="M10 44 A10 10 0 0 0 30 44"/>
          <path d="M76 28 L66 44 M76 28 L86 44"/>
          <path d="M66 44 A10 10 0 0 0 86 44"/>
        </svg>
      </div>
      <div class="code">422</div>
      <h1>Essa oferta não bateu</h1>
      <p>Recebemos o seu pedido, mas os dados não passaram na balança. Confere o que você enviou e tenta de novo.</p>
      <a class="btn" href="/">Voltar pra feira</a>
    </main>
  </body>
</html>
