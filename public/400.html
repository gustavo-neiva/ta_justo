<!doctype html>
<html lang="pt-BR">
  <head>
    <title>Pedido inválido — Tá Justo?</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      :root {
        --color-primary: #035925;
        --color-primary-light: #2e7d32;
        --color-accent: #f5e197;
        --color-text: #1a1a1a;
        --color-text-secondary: #585858;
        --color-bg: #fafafa;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        background: var(--color-bg);
        color: var(--color-text);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 24px;
        text-align: center;
      }
      main { max-width: 480px; }
      .art { width: 96px; height: 96px; margin: 0 auto; }
      .art svg { display: block; }
      .code {
        display: inline-block;
        background: var(--color-primary);
        color: var(--color-accent);
        font-weight: 800;
        font-size: 0.875rem;
        letter-spacing: 0.1em;
        padding: 4px 12px;
        border-radius: 9999px;
        margin: 16px 0 8px;
      }
      h1 { font-size: 1.875rem; font-weight: 700; margin-bottom: 12px; }
      p { color: var(--color-text-secondary); line-height: 1.65; margin-bottom: 32px; }
      a.btn {
        display: inline-block;
        background: var(--color-primary);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
      }
      a.btn:hover { background: var(--color-primary-light); }
    </style>
  </head>
