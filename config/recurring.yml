production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  
  # Fetch latest CEASA-RJ bulletin every weekday at 9am (Brasília time)
  fetch_ceasa_rio:
    class: FetchCeasaRioJob
    queue: default
    schedule: every weekday at 9am America/Sao_Paulo
  
  # Reconcile missing bulletins every Sunday at 4am
  backfill_ceasa_rio:
    class: BackfillCeasaRioJob
    queue: default
    schedule: every Sunday at 4am America/Sao_Paulo

  # Heal the local PDF archive for bulletins missing a source PDF
  ceasa_archive_backfill:
    class: CeasaArchiveBackfillJob
    queue: default
    schedule: every Sunday at 6am America/Sao_Paulo
  
  # Refresh price indices (IPCA + INPC) every Sunday at 5am
  refresh_price_indices:
    class: RefreshPriceIndicesJob
    queue: default
    schedule: every Sunday at 5am America/Sao_Paulo
