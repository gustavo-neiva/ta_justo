# Checker catalog — what a shopper SEES at the stall, mapped to CEASA rows.
#
# CEASA groups by the first word of a name ("BATATA" holds four different
# plants; "LIMÃO" holds a lime and a lemon). The checker groups by item: one
# plant/part with one culinary use. ProductMap/Parser are untouched — members
# point at existing (product slug, exact variant name) pairs.
#
# Fields
#   id          stable slug (used in ?item= and recent-items storage)
#   name        what people call it here (Rio)
#   scientific  botanical identity shown on the card
#   group       legumes | folhas | temperos | raizes | frutas | ovos
#   icon        file in app/assets/images/produce/ (IconOven, MIT); omit → group fallback
#   tint        red | green | orange | yellow | purple | brown
#   top         true → shown in the stall grid before "mais"
#   aliases     other names people type (regional, store labels, abbreviations)
#   closest     varieties CEASA does NOT quote; search hits here show `note`
#   confuse     ids of items with a misleading similar name
#   members     CEASA variants; label/hint are shopper-facing (variety chips)
#
# test/models/checker_catalog_test.rb checks every member exists (exact
# Unicode) and every produce variant belongs to exactly one item.

